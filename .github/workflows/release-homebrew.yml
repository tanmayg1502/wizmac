name: Release Homebrew Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (for example 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      MACOS_SIGNING_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PUBLIC_RELEASES_REPO: tanmayg1502/wizmac-releases
      HOMEBREW_TAP_REPO: tanmayg1502/homebrew-wizmac
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" = "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Require signed notarized releases for tags
        if: ${{ github.ref_type == 'tag' }}
        run: |
          missing=0
          for name in DEVELOPER_ID_APPLICATION MACOS_SIGNING_CERT_BASE64 MACOS_SIGNING_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Tagged Homebrew releases must be Developer ID signed and notarized, otherwise macOS will block the app." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_SIGNING_CERT_BASE64 != '' && env.MACOS_SIGNING_CERT_PASSWORD != '' }}
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-wizmac
        run: |
          CERT_PATH="$RUNNER_TEMP/wizmac-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wizmac-signing.keychain-db"
          echo "$MACOS_SIGNING_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build app bundle and release zip
        run: |
          identity="${DEVELOPER_ID_APPLICATION:-"-"}"
          scripts/build_wizmac_app.sh --version "${{ steps.version.outputs.value }}" --codesign-identity "$identity"

      - name: Notarize app bundle
        if: ${{ env.DEVELOPER_ID_APPLICATION != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcrun notarytool submit .build/package/Wizmac.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple .build/package/Wizmac.app
          ditto -c -k --sequesterRsrc --keepParent .build/package/Wizmac.app .build/package/Wizmac.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizmac-${{ steps.version.outputs.value }}
          path: |
            .build/package/Wizmac.app
            .build/package/Wizmac.zip

      - name: Publish release asset
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: .build/package/Wizmac.zip

      - name: Compute release asset checksum
        if: ${{ github.ref_type == 'tag' && env.CROSS_REPO_PAT != '' }}
        id: checksum
        run: |
          sha=$(shasum -a 256 .build/package/Wizmac.zip | awk '{print $1}')
          echo "value=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish public Homebrew binary release
        if: ${{ github.ref_type == 'tag' && env.CROSS_REPO_PAT != '' }}
        env:
          GH_TOKEN: ${{ env.CROSS_REPO_PAT }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          repo="$PUBLIC_RELEASES_REPO"
          notes="Public Wizmac binary distribution for Homebrew tap."

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" .build/package/Wizmac.zip --repo "$repo" --clobber
          else
            gh release create "$tag" .build/package/Wizmac.zip --repo "$repo" --title "$tag" --notes "$notes"
          fi

      - name: Update public Homebrew tap formula
        if: ${{ github.ref_type == 'tag' && env.CROSS_REPO_PAT != '' }}
        env:
          GH_TOKEN: ${{ env.CROSS_REPO_PAT }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          sha="${{ steps.checksum.outputs.value }}"
          tap_dir="$RUNNER_TEMP/homebrew-wizmac"
          formula_path="$tap_dir/Formula/wizmac.rb"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "$tap_dir"

          cat >"$formula_path" <<EOF
          class Wizmac < Formula
            desc "Shared macOS automation service and CLI"
            homepage "https://github.com/tanmayg1502/wizmac-releases"
            url "https://github.com/tanmayg1502/wizmac-releases/releases/download/${tag}/Wizmac.zip"
            sha256 "${sha}"
            license "MIT"

            depends_on macos: ">= :ventura"

            def install
              bin.install "Wizmac.app/Contents/Resources/bin/wizmac"
              bin.install "Wizmac.app/Contents/MacOS/WizmacService"
            end

            service do
              run [opt_bin/"WizmacService"]
              keep_alive true
            end

            test do
              system bin/"wizmac", "help"
              assert_predicate bin/"WizmacService", :exist?
              assert_predicate bin/"WizmacService", :executable?
            end
          end
          EOF

          git -C "$tap_dir" config user.name "github-actions[bot]"
          git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap_dir" add Formula/wizmac.rb
          if git -C "$tap_dir" diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi
          git -C "$tap_dir" commit -m "Update wizmac formula to ${tag}"
          git -C "$tap_dir" push origin HEAD:main
