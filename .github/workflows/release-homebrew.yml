name: Release Homebrew Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (for example 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      MACOS_SIGNING_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" = "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_SIGNING_CERT_BASE64 != '' && env.MACOS_SIGNING_CERT_PASSWORD != '' }}
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-wizmac
        run: |
          CERT_PATH="$RUNNER_TEMP/wizmac-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wizmac-signing.keychain-db"
          echo "$MACOS_SIGNING_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build app bundle and release zip
        run: |
          identity="${DEVELOPER_ID_APPLICATION:-"-"}"
          scripts/build_wizmac_app.sh --version "${{ steps.version.outputs.value }}" --codesign-identity "$identity"

      - name: Notarize app bundle
        if: ${{ env.DEVELOPER_ID_APPLICATION != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcrun notarytool submit .build/package/Wizmac.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple .build/package/Wizmac.app
          ditto -c -k --sequesterRsrc --keepParent .build/package/Wizmac.app .build/package/Wizmac.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizmac-${{ steps.version.outputs.value }}
          path: |
            .build/package/Wizmac.app
            .build/package/Wizmac.zip

      - name: Publish release asset
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: .build/package/Wizmac.zip
